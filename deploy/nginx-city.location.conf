# MrCode City servido em https://admin.mistercode.com.br/city/ — mesmo domínio do MrCodeAdmin,
# então o front chama /api sem CORS e os links "Abrir no MrCodeAdmin" funcionam como estão.
#
# Colar DENTRO do bloco `server { ... }` de deploy/nginx-mrcodeadmin.conf (repositório mr-code-admin),
# antes do `location / { ... }`. Depois: sudo nginx -t && sudo systemctl reload nginx
#
# Build:  VITE_BASE=/city/ npm ci && npm run build
# Cópia:  rm -rf /opt/mrcodecity/* && cp -r dist/* /opt/mrcodecity/ && chown -R www-data:www-data /opt/mrcodecity

location /city/ {
    alias /opt/mrcodecity/;
    # Uma página só (SPA): qualquer rota volta para o index.html.
    try_files $uri $uri/ /city/index.html;
}

# Arquivos com hash no nome podem ficar em cache "para sempre"; o index.html nunca.
location /city/assets/ {
    alias /opt/mrcodecity/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
}
